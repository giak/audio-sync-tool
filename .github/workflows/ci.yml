name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck + lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Typecheck
        run: npm run typecheck

      # Lint couvre volontairement uniquement static/src (biome check inclut le formatage).
      # Le backend Python et les scripts de build ne sont pas lintés.
      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      # Ordre d'exécution aléatoire : détecte les fuites d'état entre tests
      # (flakiness) que le run séquentiel ne voit pas. Cf. review EPICs 2026-08-08.
      - name: Vitest (shuffle, graine aléatoire — exploration)
        run: npm run test:shuffle

      # 3 graines FIXES : un échec est reproductible localement via
      # `npx vitest run --sequence.shuffle --sequence.seed=N` (l'échec en
      # graine aléatoire n'est pas rejouable). Phase 0 refactoring 2026-09-19 :
      # le shuffle global y a révélé 2 fichiers flaky (state.filters non
      # réinitialisé) invisibles en séquentiel.
      - name: Vitest (shuffle, 3 graines fixes)
        run: npm run test:shuffle:gate

      - name: Pytest
        run: python -m pytest -q

      - name: Build
        run: npm run build
